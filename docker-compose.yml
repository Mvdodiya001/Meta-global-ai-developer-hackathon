# ClauseTrace full backend stack: API + Postgres + FalkorDB.
# One server is enough (demo traffic; ~500MB idle here, caps below).
#
# ALL secrets and runtime settings come from .env (gitignored) — this
# file contains no passwords or keys and is safe to commit.
#   cp .env.example .env   # then fill MODEL_API_KEY + POSTGRES_PASSWORD
#   docker compose up --build -d
#   curl http://127.0.0.1:8000/api/health
# The API seeds the demo database on first boot automatically.
# Postgres is published on 5543 and FalkorDB on 6380 to avoid clashing
# with existing host services; the API talks to both over the
# internal network.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Only wiring that differs inside the compose network; every
      # secret/setting (MODEL_API_KEY, LLM_MODE, DEMO_MODE, CHALLENGER,
      # API_STUB, CT_*) arrives via env_file above.
      CLAUSETRACE_DB_URL: postgresql+psycopg://clausetrace:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/clausetrace
      CT_GRAPH_HOST: falkordb
      CT_GRAPH_PORT: "6379"
      CT_GRAPH_NAME: clausetrace
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
    restart: unless-stopped
    mem_limit: 2g

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clausetrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: clausetrace
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausetrace -d clausetrace"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 3g

  falkordb:
    image: falkordb/falkordb-server:v4.22.0
    volumes:
      - falkdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    mem_limit: 1g

volumes:
  pgdata: {}
  falkdata: {}
