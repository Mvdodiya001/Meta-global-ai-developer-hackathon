interpretation: |
  Reasonable safeguards include, at a minimum, data security measures such as encryption, obfuscation, masking or virtual tokens. A clause meets this card only when it names such a measure.
span_text: (a) appropriate data security measures, such as securing of personal data through encryption, obfuscation, masking or the use of virtual tokens mapped to that personal data;
