interpretation: |
  On a personal data breach the Data Fiduciary must intimate the Board and each affected Data Principal in the prescribed form and manner. A clause meets this card only when it assigns that intimation duty.
span_text: (6) In the event of a personal data breach, the Data Fiduciary shall give the Board and each affected Data Principal, intimation of such breach in such form and manner as may be prescribed.
