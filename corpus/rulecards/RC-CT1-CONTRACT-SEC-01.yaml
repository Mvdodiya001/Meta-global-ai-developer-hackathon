interpretation: |
  The contract between a Data Fiduciary and its Data Processor must itself provide for reasonable security safeguards. A clause meets this card only when the contract text carries such a safeguard provision.
span_text: (f) appropriate provision in the contract entered into between such Data Fiduciary and such a Data Processor, wherever applicable, for taking reasonable security safeguards; and
