interpretation: |
  A Data Fiduciary may engage a Data Processor only under a valid contract, and stays responsible for compliance regardless of that contract. A clause meets this card only when it names the processor relationship and rests on a valid contract.
span_text: (2) A Data Fiduciary may engage, appoint, use or otherwise involve a Data Processor to process personal data on its behalf for any activity related to offering of goods or services to Data Principals only under a valid contract.
