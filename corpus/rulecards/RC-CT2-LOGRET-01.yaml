interpretation: |
  Logs and personal data that support breach detection, investigation and continued processing must be kept for one year unless another law requires otherwise. A clause meets this card only when it commits to that retention.
span_text: (e) for enabling the detection of unauthorised access, its investigation, remediation to prevent recurrence and continued processing in the event of such a compromise, retain such logs and personal data for a period of one year, unless compliance with any law for the time being in force requires otherwise;
